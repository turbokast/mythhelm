version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      go-modules:
        patterns: ["*"]
    commit-message:
      prefix: build
  - package-ecosystem: npm
    directory: /scripts/ci/browser
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      browser-driver:
        patterns: ["*"]
    commit-message:
      prefix: build
