name: Release

# Publishes a release from a version tag. The operator publishes the
# release-drafter draft, which creates the tag (docs/release-process.md); a tag
# pushed any other way fails the format gate or waits on the `release`
# environment's required reviewer, so no tag text alone grants publishing.
on:
  push:
    tags: ['v*']

permissions: {}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    # The environment holds the required reviewer and the v* tag policy; the
    # job does not start until both are satisfied.
    environment: release
    timeout-minutes: 60
    permissions:
      contents: write # GoReleaser and gh upload release assets with GITHUB_TOKEN
      id-token: write # OIDC token for cosign keyless signing and the attestation
      attestations: write # store the build-provenance attestations
    steps:
      # The v* glob admits malformed names, so the format is the gate. This
      # step runs before checkout and every build or publish step.
      - name: Validate tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! printf '%s\n' "$TAG" | grep -E "^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)+)?$"; then
            echo "::error::tag '$TAG' is not a v<semver> release tag with dotted pre-release markers"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # GoReleaser derives the version and changelog scope from tags
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Install syft
        run: |
          go install github.com/anchore/syft/cmd/syft@v1.52.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Generate third-party licence notices
        run: go run github.com/google/go-licenses/v2@v2.0.1 save ./cmd/mythhelm --save_path=third_party_licenses

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.18.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Sign checksums with cosign
        run: cosign sign-blob --yes --bundle dist/checksums.txt.sigstore.json dist/checksums.txt

      - name: Upload cosign bundle to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" dist/checksums.txt.sigstore.json --repo "$GITHUB_REPOSITORY"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/checksums.txt
            dist/*.tar.gz
            dist/*.zip
