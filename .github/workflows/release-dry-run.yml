name: Release dry run

on:
  push:
    tags: ["test/*"]

permissions: {}

jobs:
  dry-run:
    name: Snapshot build and signing roundtrip
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      # Checkout reads the repository; nothing here writes to it.
      contents: read
      # Mints the OIDC token that cosign keyless signing exchanges for a certificate.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # GoReleaser derives the snapshot version and commit from full history.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Install syft, go-licenses and cosign
        run: |
          export GOBIN="$RUNNER_TEMP/bin"
          mkdir -p "$GOBIN"
          echo "$GOBIN" >> "$GITHUB_PATH"
          go install github.com/anchore/syft/cmd/syft@v1.52.0
          go install github.com/google/go-licenses/v2@v2.0.1
          go install github.com/sigstore/cosign/v3/cmd/cosign@v3.1.3
      - name: Generate licence notices
        run: go-licenses save ./cmd/mythhelm --save_path=third_party_licenses
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        env:
          # A test tag is not a version; pin a semver base so the snapshot version resolves.
          GORELEASER_CURRENT_TAG: v0.0.0
        with:
          distribution: goreleaser
          version: v2.18.2
          args: release --snapshot --clean
      - name: Assert the five-pair matrix in dist
        run: |
          set -euo pipefail
          test -f dist/checksums.txt
          test "$(find dist -maxdepth 1 -name 'mythhelm_*.tar.gz' | wc -l)" -eq 3
          test "$(find dist -maxdepth 1 -name 'mythhelm_*.zip' | wc -l)" -eq 2
          test "$(find dist -maxdepth 1 -name 'mythhelm_*.sbom.json' | wc -l)" -eq 5
          for pair in linux_amd64 linux_arm64 darwin_arm64 windows_amd64 windows_arm64; do
            test "$(find dist -maxdepth 1 -name "mythhelm_*_${pair}.*" ! -name '*.sbom.json' | wc -l)" -eq 1
          done
          if grep -q darwin_amd64 dist/checksums.txt; then
            echo 'darwin_amd64 must not be in the release matrix' >&2
            exit 1
          fi
          (cd dist && sha256sum -c checksums.txt)
      - name: Check version output and notices payload
        run: |
          set -euo pipefail
          archive="$(find dist -maxdepth 1 -name 'mythhelm_*_linux_amd64.tar.gz')"
          unpack="$RUNNER_TEMP/unpack"
          mkdir -p "$unpack"
          tar -xzf "$archive" -C "$unpack"
          test -f "$unpack/LICENSE"
          test -f "$unpack/NOTICE"
          test -d "$unpack/third_party_licenses"
          test -n "$(find "$unpack/third_party_licenses" -type f)"
          "$unpack/mythhelm" version | tee "$RUNNER_TEMP/version.txt"
          grep -q SNAPSHOT "$RUNNER_TEMP/version.txt"
      - name: Sign checksums with cosign keyless
        run: cosign sign-blob --yes --bundle dist/checksums.txt.sigstore.json dist/checksums.txt
      - name: Verify the cosign bundle
        env:
          IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release-dry-run.yml@${{ github.ref }}
        run: |
          cosign verify-blob \
            --bundle dist/checksums.txt.sigstore.json \
            --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            dist/checksums.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          retention-days: 7
          if-no-files-found: error
