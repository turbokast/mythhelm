name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  workflows:
    name: Lint workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Generate third-party licence notices
        run: go run github.com/google/go-licenses/v2@v2.0.1 save ./cmd/mythhelm --save_path=third_party_licenses
      - name: Assert GoReleaser config version header
        # goreleaser check only warns on a missing header, so assert it here.
        run: |
          grep -qx 'version: 2' .goreleaser.yml
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.18.2
          args: check

  detect:
    name: Detect Go module
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.detect.outputs.go }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: detect
        run: echo "go=$([ -f go.mod ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  go:
    name: Go (${{ matrix.os }})
    needs: detect
    if: needs.detect.outputs.go == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Format
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - if: matrix.os != 'windows-11-arm'
        run: go test -race ./...
      # The race detector does not support windows/arm64.
      - if: matrix.os == 'windows-11-arm'
        run: go test ./...
      - run: go mod tidy -diff

  lint:
    name: golangci-lint
    needs: detect
    if: needs.detect.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2

  govulncheck:
    name: govulncheck
    needs: detect
    if: needs.detect.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  licenses:
    name: go-licenses
    needs: detect
    if: needs.detect.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Check licences against the dependency-review allow-list
        run: |
          allowed="$(sed -n 's/^ *allow-licenses: *//p' .github/workflows/dependency-review.yml | tr -d ' ')"
          if [ -z "$allowed" ] || [ "$(printf '%s\n' "$allowed" | wc -l)" -ne 1 ]; then
            echo "::error::expected exactly one allow-licenses line in dependency-review.yml"
            exit 1
          fi
          echo "Allowed: $allowed"
          go run github.com/google/go-licenses/v2@v2.0.1 check ./... --include_tests --allowed_licenses="$allowed"

  harness:
    name: Harness
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Shellcheck
        run: |
          shellcheck --version
          git ls-files -z -- '*.sh' | xargs -0 shellcheck
      - name: Hook and script tests
        run: .claude/hooks/tests/run-tests.sh
      - name: Agent harness lint
        run: scripts/ci/lint-agent-harness.sh
      - name: Public hygiene
        run: scripts/ci/check-public-hygiene.sh

  ci-ok:
    name: CI OK
    if: always()
    needs: [workflows, detect, go, lint, govulncheck, licenses, harness]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
