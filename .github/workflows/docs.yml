name: Docs

on:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    name: Docs checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: the manifest-revision check needs the declared
          # binary_commit present locally, whatever its age.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Check root-guide mirrors are fresh
        run: |
          fail=0
          for pair in "LICENSE:docs/mirror/LICENSE.md" \
              "SECURITY.md:docs/mirror/SECURITY.md" \
              "CHANGELOG.md:docs/mirror/CHANGELOG.md" \
              "GOVERNANCE.md:docs/mirror/GOVERNANCE.md"; do
            src="${pair%%:*}"
            mirror="${pair##*:}"
            if ! cmp -s "$src" "$mirror"; then
              echo "::error::$mirror drifts from $src; refresh with: cp $src $mirror"
              fail=1
            fi
          done
          exit "$fail"
      # The revision check runs before the transcript check so an unknown
      # revision fails fast naming the revision (design §4 steps 2–3).
      - name: Check manifest revisions are present
        run: |
          python3 - docs/demos/manifest.json > /tmp/honesty.revisions <<'EOF'
          import json, sys
          manifest = json.load(open(sys.argv[1], encoding="utf-8"))
          for rec in manifest["recordings"]:
              print("%s|%s" % (rec["name"], rec["binary_commit"]))
          EOF
          fail=0
          while IFS='|' read -r recording commit || [ -n "$recording" ]; do
            if ! printf '%s' "$commit" | grep -Eq '^[0-9a-f]{40}$'; then
              echo "::error::recording '$recording' binary_commit '$commit' is not a 40-character hex revision"
              fail=1
              continue
            fi
            if ! git cat-file -t "$commit" >/dev/null 2>&1; then
              echo "::error::recording '$recording' binary_commit $commit is not present in the repo; re-record with docs/demos/record.sh --repin"
              fail=1
            fi
          done < /tmp/honesty.revisions
          exit "$fail"
      - name: Check recording transcripts are fresh at the declared revision
        run: |
          commit="$(python3 -c 'import json; print(json.load(open("docs/demos/manifest.json", encoding="utf-8"))["recordings"][0]["binary_commit"])')"
          parent="$(mktemp -d)"
          trap 'git worktree remove --force "$parent/wt" 2>/dev/null; rmdir "$parent" 2>/dev/null || true' EXIT
          git worktree add --detach "$parent/wt" "$commit"
          # Build the binary from source at the declared revision (go build,
          # never go run — design §3), re-run each recording's pipeline with
          # the checked-in normalization, and diff against the checked-in transcript.
          (cd "$parent/wt" || exit 1; go build -o /tmp/mythhelm-honesty ./cmd/mythhelm)
          /tmp/mythhelm-honesty demo --check pass \
            | sed -E -f docs/demos/normalize.sed > /tmp/honesty.transcript.txt
          # The binary's own exit status, never sed's (design §3).
          test "${PIPESTATUS[0]}" -eq 0
          if ! diff /tmp/honesty.transcript.txt docs/demos/demo.transcript.txt; then
            echo "::error::docs/demos/demo.transcript.txt drifts from a regen at $commit; re-record with docs/demos/record.sh"
            exit 1
          fi
          # The tui takes (tui-tape-recording design §3): linear-mode outputs
          # driven alongside the interactive takes. Each take is its own
          # pipeline with its own PIPESTATUS assertion — one brace-group
          # pipeline would expose only the last take's status and mask the
          # first take's failure.
          TERM=dumb /tmp/mythhelm-honesty demo --check pass 2>&1 \
            | sed -E -f docs/demos/normalize.sed > /tmp/honesty.tui.t1
          test "${PIPESTATUS[0]}" -eq 0
          /tmp/mythhelm-honesty demo --check pass --accessible 2>&1 \
            | sed -E -f docs/demos/normalize.sed > /tmp/honesty.tui.t2
          test "${PIPESTATUS[0]}" -eq 0
          {
            echo "=== take: linear (TERM=dumb) ==="
            cat /tmp/honesty.tui.t1
            echo "=== take: accessible (--accessible) ==="
            cat /tmp/honesty.tui.t2
          } > /tmp/honesty.tui.transcript.txt
          if ! diff /tmp/honesty.tui.transcript.txt docs/demos/tui.transcript.txt; then
            echo "::error::docs/demos/tui.transcript.txt drifts from a regen at $commit; re-record with docs/demos/record.sh"
            exit 1
          fi
          # The hero take: a linear companion run (run, SIGKILL, pgrep, runs
          # list, recover, review) of the pinned binary, merged stdout and stderr.
          # The PIPESTATUS assertion is the script's own exit status, never sed's.
          (HERO_BIN=/tmp/mythhelm-honesty HERO_TMP=/tmp/demo \
            docs/demos/hero-transcript.sh 2>&1) \
            | sed -E -f docs/demos/normalize.sed > /tmp/honesty.hero.transcript.txt
          test "${PIPESTATUS[0]}" -eq 0
          if ! diff /tmp/honesty.hero.transcript.txt docs/demos/hero.transcript.txt; then
            echo "::error::docs/demos/hero.transcript.txt drifts from a regen at $commit; re-record with docs/demos/record.sh"
            exit 1
          fi
          echo "recording 'hero': transcript fresh at $commit"
      - name: Check recording capabilities have passing qualifiers
        run: |
          commit="$(python3 -c 'import json; print(json.load(open("docs/demos/manifest.json", encoding="utf-8"))["recordings"][0]["binary_commit"])')"
          parent="$(mktemp -d)"
          trap 'git worktree remove --force "$parent/wt" 2>/dev/null; rmdir "$parent" 2>/dev/null || true' EXIT
          git worktree add --detach "$parent/wt" "$commit"
          python3 - docs/demos/manifest.json > /tmp/honesty.qualifiers <<'EOF'
          import json, sys
          manifest = json.load(open(sys.argv[1], encoding="utf-8"))
          pins = {rec["binary_commit"] for rec in manifest["recordings"]}
          assert len(pins) == 1, "recordings name distinct revisions: %s" % sorted(pins)
          for rec in manifest["recordings"]:
              for cap in rec["capabilities"]:
                  print("%s|%s|%s" % (rec["name"], cap["name"], cap["qualifier"]))
          EOF
          fail=0
          while IFS='|' read -r recording capability qualifier || [ -n "$recording" ]; do
            case "$qualifier" in
              '' | *[!A-Za-z0-9_]*)
                echo "::error::recording '$recording' capability '$capability' names qualifier '$qualifier', which is not a Go test name"
                fail=1
                continue
                ;;
            esac
            # Never grep -q: quiet grep closes the pipe on first match and can
            # SIGPIPE a passing go test run. A bare -run exits 0 even when the
            # qualifier matches nothing, so the --- PASS line is the assertion.
            if (cd "$parent/wt" || exit 1; set -o pipefail; go test -v -run "^${qualifier}$" -count=1 ./... | grep -E "^--- PASS: ${qualifier}" >/dev/null); then
              echo "recording '$recording': qualifier $qualifier passed at $commit"
            else
              echo "::error::recording '$recording' capability '$capability' has no passing qualifier $qualifier at $commit; point the capability at a test that passes at the pinned revision, or re-record with docs/demos/record.sh --repin"
              fail=1
            fi
          done < /tmp/honesty.qualifiers
          exit "$fail"

  build:
    name: Build docs site
    outputs:
      tree-digest: ${{ steps.tree.outputs.digest }}
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The mirrors carry no front matter in the tree (the checks job forbids
      # drift); Jekyll skips .md files without it, so inject it transiently.
      # This runs after checks, so it cannot mask mirror drift.
      - name: Inject mirror front matter
        run: |
          inject() {
            printf -- '---\nlayout: default\ntitle: %s\n---\n' "$2" \
              | cat - "docs/mirror/$1" > "docs/mirror/$1.new"
            mv "docs/mirror/$1.new" "docs/mirror/$1"
          }
          inject LICENSE.md LICENSE
          inject SECURITY.md "Security policy"
          inject CHANGELOG.md Changelog
          inject GOVERNANCE.md Governance
      - name: Enable checked examples in this gated build
        run: |
          printf 'enabled: true\n' > docs/_data/example_checks.yml
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1.0.13
        with:
          source: ./docs
      - name: Assert mirrors rendered
        run: |
          for page in LICENSE SECURITY CHANGELOG GOVERNANCE; do
            if [ ! -f "_site/mirror/$page.html" ]; then
              echo "::error::expected _site/mirror/$page.html in the built site"
              exit 1
            fi
          done
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
      - name: Record immutable site digest and reject fixture markers
        id: tree
        run: |
          digest="$(python3 scripts/ci/check_docs_examples.py --digest)"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Check built content
        run: python3 scripts/ci/check_docs_site.py --site _site --docs docs
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '24.15.0'
          package-manager-cache: false
      - name: Install locked browser driver
        run: npm ci --prefix scripts/ci/browser --ignore-scripts
      # Static fixtures live in mktemp directories, never the published _site.
      - name: Browser rejection fixtures
        run: bash scripts/ci/browser/test_check_layout.sh
      - name: Check rendered layout
        run: node scripts/ci/browser/check_layout.mjs _site
      - name: Assert checks did not modify the uploaded tree
        env:
          EXPECTED_DIGEST: ${{ steps.tree.outputs.digest }}
        run: test "$(python3 scripts/ci/check_docs_examples.py --digest)" = "$EXPECTED_DIGEST"

  examples:
    name: Docs examples
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      DOCS_GO_IMAGE: golang:1.27.1@sha256:162be5298a40ed317005c8339c6de4d10d3eef336d66dc8e9259b03ab9d3a6d2
      EXPECTED_DIGEST: ${{ needs.build.outputs.tree-digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: github-pages
          path: ${{ runner.temp }}/pages-artifact
      - name: Verify the uploaded tree
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/pages-artifact
        run: |
          mkdir _site
          tar -xf "$ARTIFACT_DIR/artifact.tar" -C _site
          test "$(python3 scripts/ci/check_docs_examples.py --digest)" = "$EXPECTED_DIGEST"
      - name: Prefetch Go modules and the pinned sandbox image
        run: |
          go mod download
          docker pull "$DOCS_GO_IMAGE"
      - name: Run every listed example offline without credentials
        run: |
          python3 scripts/ci/check_docs_examples.py --workflows
          python3 scripts/ci/check_docs_examples.py --site _site --docs docs \
            --module-cache "$(go env GOMODCACHE)" --image "$DOCS_GO_IMAGE"
          test "$(python3 scripts/ci/check_docs_examples.py --digest)" = "$EXPECTED_DIGEST"

  deploy:
    name: Deploy docs site
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, examples]
    # Serialize only the push-gated deploys: site checks on PRs never enter
    # this group, so they cannot starve or replace a pending deploy. (No
    # queue key: actionlint rejects it; pending replacement within main
    # pushes is latest-wins, which is safe for idempotent site publishes.)
    concurrency:
      group: pages
    runs-on: ubuntu-latest
    permissions:
      # Deploy the built site to GitHub Pages.
      pages: write
      # Request the OIDC token deploy-pages uses to authenticate the deployment.
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
