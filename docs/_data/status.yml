# Status panel data: the works / in progress / not yet panel and the
# landing-page cells render from this file (docs-site-restyle AC-2.3).
# Schema — every item is a mapping with exactly these keys:
#   id:      kebab-case identifier; landing-page cells name an item by id.
#   section: exact text of a "##" heading in docs/limitations.md. The
#            quoted region is the text under that heading up to the next
#            "##" heading.
#   quote:   a phrase occurring verbatim under the named heading; the
#            panel displays this text. "works" items quote "Supported
#            today" (the limits sections only as caveats on a "works"
#            item); "in-progress" and "not-yet" items quote only
#            "Not supported yet".
#   column:  exactly one of "works", "in-progress", "not-yet". The
#            rendered headings may read Works / In progress / Not yet;
#            this field, the renderer and the checks use the hyphenated
#            values verbatim.
#   tracker: for "in-progress" items, the issue (for example "#348") or
#            spec named inside the quote; null for every other column.
# Limits items are caveats, displayed alongside their corresponding working
# capability. Later tasks consume this shape verbatim.
- id: offline-demo
  section: "Supported today"
  quote: "`mythhelm demo`: a fully offline scripted run in a disposable repository"
  column: works
  tracker: null
- id: supervisor-routing
  section: "Not supported yet"
  quote: "In S1, stop and recover run locally from the CLI; the supervisor service does not serve them. Routing them through journal ingest is a follow-up (#348)."
  column: in-progress
  tracker: "#348"
- id: plugins-routing
  section: "Not supported yet"
  quote: "Plugins and routing are still planned."
  column: not-yet
  tracker: null
- id: attention
  section: "Not supported yet"
  quote: "The attention queue for approvals is not supported yet."
  column: not-yet
  tracker: null
- id: recovery
  section: "Supported today"
  quote: "`mythhelm stop`, `mythhelm recover` and `mythhelm runs list`, run locally\n  from the CLI."
  column: works
  tracker: null
- id: recovery-limit
  section: "Not supported yet"
  quote: "`mythhelm recover` quarantines a run whose worker was killed outright (`worker_lost`, exit 6), and a quarantined run blocks every later run with `active_run_exists`; no command resolves it yet (#391)."
  column: in-progress
  tracker: "#391"
- id: verification
  section: "Supported today"
  quote: "Protected acceptance for the one-agent flow: verdicts bound to the candidate,\n  contract, check definitions and evaluator, `NOT RUN` and `STALE` outcomes and\n  a documented JSONL event set, with the limits listed below."
  column: works
  tracker: null
- id: verification-limit
  section: "Acceptance limits"
  quote: "**The files a check executes are not protected.**"
  column: works
  tracker: null
- id: quota-gauge
  section: "Not supported yet"
  quote: "Allowance exhaustion is recognised only from a synthetic fixture shape; no\n  recorded native run produces it, so on a real route the bucket is not\n  recorded and the retry schedule never starts."
  column: not-yet
  tracker: null
