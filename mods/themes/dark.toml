# Built-in Observatory (dark) theme: nine #rrggbb tokens, no code paths (I11).
# No custom font is needed (I13). Unknown and missing keys are rejected.
# Text, text_muted, attention and err meet 4.5:1 on both surfaces;
# ok meets 4.5:1 on surface only; focus meets 3:1 on both surfaces.
# Border is decorative. Contrast assumes a matching terminal background.
surface = "#090f1a"
surface_raised = "#0f1a2b"
text = "#ebeff5"
text_muted = "#989fab"
focus = "#4ddae9"
attention = "#f0c27b"
ok = "#7fd8a9"
err = "#f4918a"
border = "#4b5668"
